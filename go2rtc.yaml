# go2rtc — Harbor camera (WHIP ingest) -> Apple HomeKit
# WHIP docs: https://github.com/Harbor-Systems/harbor-python#whip-endpoint
#
# The installer prints the authenticated gateway URL for the Harbor app.
# The camera publishes to the gateway on port 1984; go2rtc's API remains local.
# so the stream name below MUST equal the camera serial.
#
app:
  # Minimize the loaded attack surface. `exec` is required for FFmpeg;
  # `srtp` carries HomeKit's encrypted video after pairing.
  modules: [api, rtsp, webrtc, exec, ffmpeg, homekit, srtp]

api:
  # Never expose go2rtc's powerful API or Web UI to the LAN.
  listen: "127.0.0.1:1985"
  allow_paths: [/api/streams, /api/webrtc]

# Apple Home pairs over this dedicated listener (Harbor's go2rtc patch); it
# serves only the HAP pairing endpoints, and everything after pairing is
# HAP-session encrypted. This keeps the API above loopback-only.
homekit_listen: ":21063"

rtsp:
  # FFmpeg uses RTSP internally; customers do not need LAN access to it.
  listen: "127.0.0.1:8554"

exec:
  # Prevent API-controlled execution of anything except FFmpeg.
  allow_paths: [ffmpeg]

streams:
  # The camera pushes into this stream via WHIP as H265 + OPUS.
  # HomeKit only supports H264 + OPUS, so we must transcode the video:
  #   #video=h264  -> transcode H265 video to H264 (required for HomeKit)
  #   #audio=opus  -> keep OPUS audio (copied, since it already matches)
  # Add #hardware for GPU-accelerated encoding if CPU use is too high.
  "CAMERA_SERIAL":
    - ffmpeg:CAMERA_SERIAL#video=h264#audio=opus

homekit:
  "CAMERA_SERIAL":
    pin: GENERATE        # install-macos-service.sh replaces this with a unique PIN
    name: Harbor Camera
