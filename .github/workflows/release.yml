name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-14
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require release commit on main
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.5"
          cache: false
      - name: Build release binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          ./scripts/build-go2rtc.sh darwin arm64 dist/go2rtc-mac-arm64
          ./scripts/build-go2rtc.sh darwin amd64 dist/go2rtc-mac-amd64
          ./scripts/build-go2rtc.sh linux arm64 dist/go2rtc-linux-arm64
          ./scripts/build-go2rtc.sh linux amd64 dist/go2rtc-linux-amd64
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/gateway-mac-arm64 ./cmd/whip-gateway
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/gateway-mac-amd64 ./cmd/whip-gateway
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/gateway-linux-arm64 ./cmd/whip-gateway
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/gateway-linux-amd64 ./cmd/whip-gateway
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/launcher-mac-arm64 ./cmd/bridge-launcher
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/launcher-mac-amd64 ./cmd/bridge-launcher
          ./scripts/build-macos-setup-app.sh "dist/Harbor HomeKit Bridge.app"
      - name: Sign macOS binaries
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          : "${APPLE_CERTIFICATE_P12:?APPLE_CERTIFICATE_P12 is required}"
          : "${APPLE_CERTIFICATE_PASSWORD:?APPLE_CERTIFICATE_PASSWORD is required}"
          : "${APPLE_SIGNING_IDENTITY:?APPLE_SIGNING_IDENTITY is required}"
          expected_identity='Developer ID Application: Project Monitor, Inc. (TC395YUVC2)'
          expected_team='TC395YUVC2'
          if [ "$APPLE_SIGNING_IDENTITY" != "$expected_identity" ]; then
            echo "APPLE_SIGNING_IDENTITY does not match Project Monitor's release identity." >&2
            exit 1
          fi
          keychain="$RUNNER_TEMP/harbor-signing.keychain-db"
          certificate="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 -D > "$certificate"
          security create-keychain -p temporary "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p temporary "$keychain"
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security list-keychain -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k temporary "$keychain"
          for binary in dist/go2rtc-mac-*; do
            codesign --force --options runtime --timestamp \
              --sign "$APPLE_SIGNING_IDENTITY" "$binary"
            codesign --verify --strict --verbose=2 "$binary"
            details="$(codesign -dv --verbose=4 "$binary" 2>&1)"
            printf '%s\n' "$details" | grep -Fqx "Authority=$expected_identity"
            printf '%s\n' "$details" | grep -Fqx "TeamIdentifier=$expected_team"
          done
          for binary in dist/gateway-mac-* dist/launcher-mac-*; do
            codesign --force --options runtime --timestamp \
              --sign "$APPLE_SIGNING_IDENTITY" "$binary"
            codesign --verify --strict --verbose=2 "$binary"
            details="$(codesign -dv --verbose=4 "$binary" 2>&1)"
            printf '%s\n' "$details" | grep -Fqx "Authority=$expected_identity"
            printf '%s\n' "$details" | grep -Fqx "TeamIdentifier=$expected_team"
          done
          codesign --force --deep --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" "dist/Harbor HomeKit Bridge.app"
          codesign --verify --deep --strict --verbose=2 "dist/Harbor HomeKit Bridge.app"
          app_details="$(codesign -dv --verbose=4 "dist/Harbor HomeKit Bridge.app" 2>&1)"
          printf '%s\n' "$app_details" | grep -Fqx "Authority=$expected_identity"
          printf '%s\n' "$app_details" | grep -Fqx "TeamIdentifier=$expected_team"
      - name: Package archives
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          : "${APPLE_SIGNING_IDENTITY:?APPLE_SIGNING_IDENTITY is required}"
          for platform in mac_arm64 mac_amd64 linux_arm64 linux_amd64; do
            package_dir="$RUNNER_TEMP/$platform"
            mkdir -p "$package_dir"
            binary_platform="${platform/_/-}"
            cp "dist/go2rtc-$binary_platform" "$package_dir/go2rtc"
            cp "dist/gateway-$binary_platform" "$package_dir/harbor-whip-gateway"
            zip_contents=(go2rtc harbor-whip-gateway)
            if [ -f "dist/launcher-$binary_platform" ]; then
              cp "dist/launcher-$binary_platform" "$package_dir/harbor-bridge-launcher"
              zip_contents+=(harbor-bridge-launcher)
            fi
            (
              cd "$package_dir"
              zip -q "$GITHUB_WORKSPACE/dist/harbor-homekit-go2rtc_${platform}.zip" \
                "${zip_contents[@]}"
            )
          done
          ./scripts/build-macos-setup-dmg.sh \
            "dist/Harbor HomeKit Bridge.app" "dist/Harbor-HomeKit-Bridge.dmg"
          codesign --force --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" "dist/Harbor-HomeKit-Bridge.dmg"
          codesign --verify --strict --verbose=2 "dist/Harbor-HomeKit-Bridge.dmg"
      - name: Notarize macOS archives
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${APPLE_ID:?APPLE_ID is required}"
          : "${APPLE_TEAM_ID:?APPLE_TEAM_ID is required}"
          : "${APPLE_APP_PASSWORD:?APPLE_APP_PASSWORD is required}"
          for archive in dist/harbor-homekit-go2rtc_mac_*.zip; do
            xcrun notarytool submit "$archive" --wait \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --team-id "$APPLE_TEAM_ID"
          done
          xcrun notarytool submit "dist/Harbor-HomeKit-Bridge.dmg" --wait \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"
          xcrun stapler staple "dist/Harbor-HomeKit-Bridge.dmg"
      - name: Generate checksums
        run: |
          cd dist
          shasum -a 256 -- *.zip *.dmg > checksums.txt
      - name: Attest release provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            dist/harbor-homekit-go2rtc_*.zip
            dist/Harbor-HomeKit-Bridge.dmg
            dist/checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Harbor HomeKit $GITHUB_REF_NAME" \
            --generate-notes \
            dist/harbor-homekit-go2rtc_*.zip \
            dist/Harbor-HomeKit-Bridge.dmg \
            dist/checksums.txt
