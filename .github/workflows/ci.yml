name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.5"
          cache: false
      - name: ShellCheck
        run: shellcheck ./*.sh ./scripts/*.sh ./tests/*.sh
      - name: Repository tests
        run: ./tests/test-repository.sh
      - name: Gateway tests
        run: |
          go test -race ./...
          go vet ./...
      - name: Build Linux container
        run: |
          docker compose config --quiet
          docker build .

  patched-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.5"
          cache: false
      - name: Build patched Apple Silicon binary
        run: ./scripts/build-go2rtc.sh darwin arm64 "$RUNNER_TEMP/go2rtc"
      - name: Inspect binary
        run: |
          file "$RUNNER_TEMP/go2rtc"
          "$RUNNER_TEMP/go2rtc" -version
